name: kustomize-diff

on:
  pull_request:

jobs:
  kustomize-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Comparing CI configuration
        uses: AdrienneCohea/kustomize-diff@v2.0.0
        with:
          search-path: .xyz/ci
          force-truecolor: true

      - name: Comparing application configuration
        uses: AdrienneCohea/kustomize-diff@v2.0.0
        with:
          search-path: .xyz/deployments
          force-truecolor: true
