name: kustomize-diff

on:
  pull_request:

jobs:
  kustomize-diff:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Comparing CI configuration
        id: ci-diff
        continue-on-error: true
        uses: AdrienneCohea/kustomize-diff@v1.0.8
        with:
          search-path: .xyz/ci
          force-truecolor: true
          set-exit-code: "true"

      - name: Comparing application configuration
        id: app-diff
        continue-on-error: true
        uses: AdrienneCohea/kustomize-diff@v1.0.8
        with:
          search-path: .xyz/deployments
          force-truecolor: true
          set-exit-code: "true"

      - name: Delete comment if no differences found
        if: steps.ci-diff.outcome == 'success' && steps.app-diff.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          comment_id=$(gh api "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.body | startswith("<!-- kustomize-diff -->")) | .id' | head -1)
          if [ -n "${comment_id}" ]; then
            gh api "repos/${REPOSITORY}/issues/comments/${comment_id}" --method DELETE
          fi

      - name: Comment on PR if differences found
        if: steps.ci-diff.outcome == 'failure' || steps.app-diff.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          job_url=$(gh api "repos/${REPOSITORY}/actions/runs/${RUN_ID}/jobs" \
            --jq '.jobs[] | select(.name == "kustomize-diff") | .html_url')
          printf '%s\n' \
            '<!-- kustomize-diff -->' \
            '# Kubernetes Manifests Changed' \
            '' \
            "Click [here to review your manifest changes](${job_url}). Each overlay that changed is shown in its own diff, which is contained in a collapsible section in the GitHub Actions logs linked above." \
            '' \
            'Note that if you changed `base` or `environments`, the same diff might be shown multiple times.' \
            '' \
            'If the changes match what you expect, you can continue to peer review and merging.' \
            '' \
            "## When Actual Changes Don't Match What You Expected" \
            '' \
            'If expected changes are missing, or a change is affecting more places than you expected, consider the following possibilities:' \
            '' \
            '- Your teammate merged other changes to these Kubernetes manifests, and you may need to rebase or update this branch.' \
            '- You made the change in `base` or `environments`, which triggered it to propagate.' \
            '- You need to change your approach and iterate locally using `kustomize build` until you achieve what you want.' \
            '' \
            '## Useful Kustomization References' \
            '' \
            '- [Declarative Management of Kubernetes Objects Using Kustomize](https://kubernetes.io/docs/tasks/manage-kubernetes-objects/kustomization/)' \
            '- [Kustomize Detailed Reference Pages](https://kubectl.docs.kubernetes.io/references/kustomize/kustomization)' \
            > /tmp/pr-comment.md
          comment_id=$(gh api "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.body | startswith("<!-- kustomize-diff -->")) | .id' | head -1)
          if [ -n "${comment_id}" ]; then
            gh api "repos/${REPOSITORY}/issues/comments/${comment_id}" \
              --method PATCH \
              --field body=@/tmp/pr-comment.md
          else
            gh pr comment "${PR_NUMBER}" \
              --repo "${REPOSITORY}" \
              --body-file /tmp/pr-comment.md
          fi
